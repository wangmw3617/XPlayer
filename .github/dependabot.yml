version: 2
updates:
  # Gradle 依赖（含 gradle/libs.versions.toml 里钉住的版本）
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # AGP / Kotlin / KSP / Hilt 互相有版本约束（见 libs.versions.toml 顶部注释），
      # 分散升级几乎必然撞车，合成一个 PR 一起看
      build-toolchain:
        patterns:
          - "com.android.tools.build:*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.google.dagger:*"
    ignore:
      # ---------------------------------------------------------------------
      # 下面这几条是「一条链」，必须**同时**升，拆开升必然互相卡住：
      #
      #   AGP 9.x       -> 要 Gradle 9.6+
      #   新 KSP        -> 要 AGP >= 8.12
      #   Hilt 2.60+    -> 要 AGP >= 9.0
      #   backdrop 2.x  -> 要 minCompileSdk 37（AGP 8.10.1 不支持 37）
      #   Compose BOM   -> 新版 AAR 同样要求更高的 minCompileSdk
      #
      # 逐个开 PR 只会得到一堆必然红的分支，掩盖真正的问题，所以这里屏蔽掉
      # major / minor，只放行 patch（补丁升级不牵动约束）。整链升级时手动做，
      # 详细约束见 gradle/libs.versions.toml 顶部注释。
      # ---------------------------------------------------------------------
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.android.tools.build:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.dagger:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "io.github.kyant0:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.compose:compose-bom"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
