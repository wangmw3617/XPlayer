version: 2
updates:
  # ==========================================================================
  #  Gradle 依赖
  #
  #  刻意**不分组**。分组会把「能升的」和「必须等整条工具链一起升的」绑进同一个
  #  PR —— kotlinx-serialization 与 coroutines 就被这样绑过一次：它们本身没问题，
  #  却因为和 Kotlin / KSP 分在一组而整组失败。需要一起升的那几个在下面单独屏蔽，
  #  其余各自出 PR。
  # ==========================================================================
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # ----------------------------------------------------------------------
      #  这是一条**必须同时升**的链，拆开升必然互相卡住：
      #
      #    AGP 9.x       -> 官方要求 Gradle >= 9.1.0、JDK 17、Build Tools 36.0.0、
      #                      KGP >= 2.2.10；最大支持 API 36.1
      #                      （注：AGP 9 强制新 DSL + 内置 Kotlin，
      #                       org.jetbrains.kotlin.android 与新 DSL 不兼容）
      #    新 KSP        -> 要 AGP >= 8.12
      #    Hilt 2.60+    -> 报 "only compatible with AGP version 9.0.0 or higher"
      #    Kotlin 2.3+   -> Hilt 2.56 的 kotlin-metadata 读不了新元数据
      #    backdrop 2.x  -> 要 minCompileSdk 37（AGP 8.10.1 不支持 37）
      #    Compose BOM / navigation / hilt-navigation
      #                  -> 新 AAR 的 minCompileSdk 同样超出当前上限
      #
      #  依赖名要**两种写法都列**：Dependabot 对 version catalog 有时按目录别名
      #  匹配（hilt / navigation），有时按 group:artifact 匹配，只写一种会漏掉。
      #
      #  整链升级时手动做，约束细节见 gradle/libs.versions.toml 顶部注释。
      # ----------------------------------------------------------------------
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.tools.build:*"
      - dependency-name: "org.jetbrains.kotlin.android"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
      - dependency-name: "com.google.devtools.ksp"
      - dependency-name: "com.google.devtools.ksp:*"
      - dependency-name: "com.google.dagger:*"
      - dependency-name: "com.google.dagger.hilt.android"
      - dependency-name: "hilt"
      - dependency-name: "androidx.hilt:*"
      - dependency-name: "hiltNavigation"
      - dependency-name: "io.github.kyant0:*"
      - dependency-name: "androidx.compose:compose-bom"
      - dependency-name: "androidx.navigation:*"
      - dependency-name: "navigation"
      # core-ktx 1.19 起要求 AGP >= 9.1
      - dependency-name: "androidx.core:*"
      - dependency-name: "coreKtx"
      # Gradle 9 是 AGP 9 的前置条件，应当一起动；单独升会让 AGP 8.10.1
      # 跑在它未声明支持的 Gradle 上，而且 PR 只跑 build、不跑 release job
      - dependency-name: "gradle-wrapper"

  # GitHub Actions 的版本升级不受上面那条链影响，独立升级
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
