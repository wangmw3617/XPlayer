[versions]
# AGP 9.4.1：Gradle ≥9.6、JDK 17、Build Tools 36.0.0，最高支持 API 37。
# 升到它之后本机可以直接用 Android Studio 自带的 JBR（25）跑 Gradle，
# 不再需要单独装 JDK 21 —— 见 gradle.properties 里的说明。
agp = "9.4.1"

# ⚠️ AGP 9 起 Kotlin 由 AGP 内置（android.builtInKotlin，默认开启），
# 不再应用 org.jetbrains.kotlin.android 插件 —— 那个插件与新 DSL 不兼容。
#
# 内置 Kotlin 的 KGP 版本来自 buildscript classpath 的依赖仲裁：
# AGP 9.4.1 自己依赖 kotlin-gradle-plugin:2.2.10，我们在顶层 buildscript
# 显式声明 kotlin-gradle-plugin:2.3.21，Gradle 取高版本 → 内置 Kotlin 就是 2.3.21。
# 这条是必需的：Compose 编译器插件、KSP 都必须与 Kotlin 版本严格对齐。
#
# 为什么必须 ≥2.3：
#   KSP 2.3.6 才开始支持内置 Kotlin，但 KSP 2.3.10 才修掉
#   「AGP 9 内置 Kotlin 下 R 类解析」（google/ksp#2857）——
#   Hilt 与 Room 生成的代码都要引用 R 类，低于 2.3.10 会直接编译失败。
kotlin = "2.4.20"

# KSP 自 2.3.0 起改成自己的版本线（不再拼 <kotlin>-<ksp> 前缀），
# 所以这里的 2.3.12 与 Kotlin 的 2.3.21 不是同一个数字体系，别对齐它们。
ksp = "2.3.12"

# Hilt 2.60.1：AGP 9 要求 Hilt ≥2.59.2（官方 agp-9-upgrade 技能 Step 1）。
# 2.56.2 内置的 kotlin-metadata-jvm 只到 2.2.0，配 AGP 9 会读不了元数据。
hilt = "2.60.1"

coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.0"
composeBom = "2025.05.00"
navigation = "2.9.0"
room = "2.8.5"
datastore = "1.1.7"
hiltNavigation = "1.2.0"
# androidx.media 只用于 MediaSessionCompat + MediaStyle 通知（后台播放/锁屏控制）。
# 1.7.0 是最终稳定版，API 已经冻结，不会再有破坏性变更。
media = "1.8.0"
documentfile = "1.1.0"
splashscreen = "1.2.0"
serialization = "1.11.0"
coroutines = "1.11.0"

# ---------------------------------------------------------------------------
# Liquid Glass（液态玻璃）视觉效果：Kyant0/AndroidLiquidGlass
#
# 库名是 backdrop，发布在 Maven Central。它只提供底层绘制原语
# （Backdrop / drawBackdrop / layerBackdrop），不含任何高层组件 ——
# 卡片、导航栏、控制层都要自己按原语拼。
#
# 停在 1.0.2。**Kotlin 元数据只向上兼容**（新编译器能读旧元数据，反之不行），
# 1.0.2 用 Kotlin 2.2.21 编，在 Kotlin 2.3.21 下完全可读，所以升 AGP 9 不必动它。
#
# 现在 Kotlin 到 2.3.21 了，理论上可以升到 1.0.6（要求 Kotlin ≥2.3.10）。
# 但那属于另一件事（1.0.x 之间公开 API 虽一致，仍要重新过一遍视觉与
# InteractiveHighlight 的实现），本次 AGP 9 迁移刻意不夹带，留作后续。
#
# 注意：backdrop 1.0.2 **不依赖** io.github.kyant0:shapes-android，
# 它的 lens() 只认 androidx 的 CornerBasedShape 与 kyant 的
# RoundedRectangularShape。项目里需要胶囊形的地方用 Compose 自带的
# RoundedCornerShape(percent = 50)（见 theme/glass/LiquidBottomTab.kt
# 的 CapsuleShape），不要引入 shapes-android —— 那个库要求
# kotlin-stdlib 2.3.0，会顶穿上面这条版本链。
# ---------------------------------------------------------------------------
liquidGlass = "1.0.2"

# ---------------------------------------------------------------------------
# libmpv（播放内核）
#
# dev.jdtech.mpv:libmpv 是 jarnedemeulemeester/libmpv-android 发布的 AAR，
# 内含 arm64-v8a / armeabi-v7a / x86 / x86_64 四套 libmpv + libplayer + FFmpeg .so，
# 并带一个与 mpv-android 同源的 MPVLib JNI 封装（create/init/destroy/
# attachSurface/setOptionString/observeProperty + EventObserver/LogObserver）。
#
# AAR 的 AndroidManifest 声明 minSdkVersion=26，所以本项目的 minSdk 也是 26。
# arm64 的 .so 段对齐是 0x4000 / 0x10000，满足 Android 15 的 16KB 页要求。
#
# 选择预编译 AAR 而不是自建 mpv-android buildscripts：后者要跑 Nix + 完整
# FFmpeg/mpv 交叉编译，CI 上动辄一小时以上且极易受上游漂移影响。
# ---------------------------------------------------------------------------
libmpv = "1.0.0"

# ---------------------------------------------------------------------------
# WebDAV 的 HTTP 客户端：OkHttp
#
# 为什么用 OkHttp 自己实现 WebDAV，而不是引现成的 WebDAV 库：
#
# 1. `com.github.thegrizzlylabs:sardine-android` 只发在 **JitPack**，
#    Maven Central 上没有。为了一个库多挂一个仓库，CI 上就多一个外部依赖点，
#    JitPack 偶发构建失败会直接挂掉出包。
# 2. `com.github.lookfirst:sardine:5.13` 在 Central 上，但它拉
#    `org.apache.httpcomponents:httpclient` + `jakarta.xml.bind` +
#    `org.glassfish.jaxb:jaxb-runtime`。JAXB 在 Android 上要额外打
#    jaxb-runtime 的字节码，包体与 R8 复杂度都不划算。
# 3. `com.github.bitfireAT:dav4jvm` 也只在 JitPack；且历史版本会传递
#    `org.ogce:xpp3`（内含 294 个 `org.xmlpull.*` 类），在 release 的 R8
#    阶段会撞 `Library class android.content.res.XmlResourceParser
#    implements program class org.xmlpull.v1.XmlPullParser`。
#
# 而播放器真正需要的 WebDAV 面很窄：PROPFIND 列目录 + GET/HEAD 取文件 +
# Basic 鉴权，XML 用 Android 自带的 `XmlPullParser` 解析（零新依赖）。
# 所以这里只引 OkHttp，其余自己写 —— 依赖树干净，R8 无隐患。
#
# 版本锁在 5.3.0，有两条硬约束同时成立才可选（已逐个解包 AAR 元数据核对）：
#
#   okhttp-android  minCompileSdk  kotlin-stdlib
#   ─────────────────────────────────────────────
#   5.2.0           1              2.2.20
#   5.3.0           1              2.2.21   ← 选它
#   5.4.0          36              2.1.21
#   5.5.0          37              2.1.21   ← 曾用它，CI 报错
#
# 1. `minCompileSdk` 必须 ≤36。5.5.0 声明 37，而本项目 compileSdk 锁死 36
#    （AGP 8.10.1 的上限，见上方工具链说明），`checkDebugAarMetadata` 会直接
#    失败：`requires ... compile against version 37 or later of the Android APIs`。
#    5.4.0 起跳到 36/37，5.3.0 还是 1，是最后一个能用的版本。
# 2. `kotlin-stdlib` 不能高于本项目的 Kotlin（2.2.21），否则 Gradle 选高版本，
#    与 KSP/Hilt 编译出的 metadata 对不上。5.3.0 恰好是 2.2.21，正好齐平。
#
# 另外必须同时声明 `okhttp-android`：`okhttp` 根 artifact 是个空壳，5.x 把
# Android 侧实现（`Credentials`、`OkHttpClient` 的 Android 平台绑定）拆到了
# `okhttp-android`，而且它是 optional 依赖，不会传递进来。
# ---------------------------------------------------------------------------
okhttp = "5.3.0"

junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# 图标库已冻结在 1.7.x，BOM 不再统一管理，必须显式给版本
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

androidx-media = { module = "androidx.media:media", version.ref = "media" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Liquid Glass 效果（见上方 versions 注释）
kyant-backdrop = { module = "io.github.kyant0:backdrop", version.ref = "liquidGlass" }

# 播放内核（见上方 versions 注释）
libmpv = { module = "dev.jdtech.mpv:libmpv", version.ref = "libmpv" }

# WebDAV 的 HTTP 客户端（见上方 versions 注释）
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-android = { module = "com.squareup.okhttp3:okhttp-android", version.ref = "okhttp" }

junit = { module = "junit:junit", version.ref = "junit" }

# 只用于顶层 buildscript 的 classpath，给 AGP 的内置 Kotlin 提供 KGP 版本
# （见上方 kotlin 注释）。不会被任何模块 implementation 引用。
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 注意：这里**没有** kotlin-android。
# AGP 9 起 Kotlin 编译内置，且该插件与新 DSL 不兼容，已移除。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
