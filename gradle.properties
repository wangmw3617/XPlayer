# =============================================================================
#  Gradle / AGP
# =============================================================================

# R8 与 Kotlin 编译器都在这个 JVM 里跑；2G 在 Compose + Hilt 全量编译时容易 OOM。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# =============================================================================
#  构建用 JDK —— 刻意不在这里配置
#
#  Android Studio 自带的 JBR 是 25，而 Gradle 8.14.3 跑不了 JDK 25
#  （官方兼容矩阵：JDK 24 → Gradle 8.14+；JDK 25 → 9.1.0+；JDK 26 → 9.4+）。
#  所以本地要用 JDK 21，与 CI 一致。
#
#  ⚠ 不要在这个文件里写 org.gradle.java.home。
#    本文件是入库的，而 JDK 路径是机器相关的绝对路径 ——
#    写进来会让 Linux CI 找不到该路径而直接构建失败。
#    机器相关的路径一律放不入库的位置：
#      · JDK 路径 → ~/.gradle/gradle.properties（Gradle 用户级，优先级更高）
#      · SDK 路径 → local.properties（已在 .gitignore 中）
# =============================================================================

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
# 非传递 R 类：各模块只引用自己的资源，编译更快、R 类更小
android.nonTransitiveRClass=true
# 依赖里携带的 R8 规则会被自动应用（libmpv 的 keep 规则就靠这个）
android.enableJetifier=false

kotlin.code.style=official
ksp.incremental=true

# =============================================================================
#  版本号
#
#  优先级：环境变量 XPLAYER_VERSION_NAME（CI 从 tag 注入） > 这里的默认值。
#  打 tag 就是唯一的发版动作，不需要改代码。
# =============================================================================
xplayer.versionName=1.2.1

# =============================================================================
#  ABI 裁剪
#
#  libmpv 的 AAR 同时带 arm64-v8a / armeabi-v7a / x86 / x86_64 四套 .so。
#  真机只需要 arm64-v8a 与 armeabi-v7a；x86_64 保留是为了模拟器能跑。
#  x86（32 位模拟器）已无实际用途，剔掉以减小产物体积。
# =============================================================================
xplayer.abis=arm64-v8a,armeabi-v7a,x86_64

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
